<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지방투자 인허가 Rule Engine Dashboard</title><style>body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#182235}*{box-sizing:border-box}.wrap{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:23px;margin:5px 0 20px}.ey{font-size:9px;color:#718097}.btn{border:1px solid #dce2eb;background:#fff;border-radius:7px;padding:9px 13px}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.panel,.swim{background:#fff;border:1px solid #e1e6ee;border-radius:11px;box-shadow:0 2px 8px #18243a08}.panel{padding:18px;margin-bottom:15px}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.form label{font-size:9px;color:#718097}.form input,.form select{width:100%;margin-top:4px;padding:7px;border:1px solid #dce3eb;border-radius:6px}.checks{font-size:9px;color:#65748a;margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(5,1fr);margin-top:15px;border-top:1px solid #edf0f4;padding-top:14px}.metric{border-right:1px solid #edf0f4;padding-left:15px}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric small{display:block;color:#8792a3;font-size:9px}.metric b{display:block;font-size:22px;margin-top:4px}.blue b{color:#2563eb}.amber b{color:#d99521}.red b{color:#d95c68}.purple b{color:#765bd3}.chips{display:flex;gap:7px;overflow:auto}.chip{border:1px solid #e0e5ec;border-radius:7px;padding:6px 9px;white-space:nowrap}.chip small{display:block;color:#8994a6;font-size:8px}.chip b{font-size:9px}.head2{display:flex;justify-content:space-between;align-items:end;margin:20px 0 9px}.head2 h2{font-size:17px;margin:0}.head2 p{font-size:9px;color:#8490a1}.swim{overflow:auto}.timeline{height:40px;margin-left:120px;min-width:800px;display:grid;grid-template-columns:repeat(8,1fr);align-items:center;text-align:center;color:#8893a4;font-size:8px;border-bottom:1px solid #edf0f4}.lane{display:flex;height:70px;min-width:920px;border-bottom:1px solid #edf0f4}.name{width:120px;flex-shrink:0;padding:15px 10px;background:#fafbfc;border-right:1px solid #e7ebf1}.name b{font-size:10px}.name small{display:block;color:#98a3b3;font-size:8px;margin-top:3px}.track{position:relative;flex:1;background:repeating-linear-gradient(to right,transparent 0,transparent calc(12.5% - 1px),#f0f2f5 calc(12.5% - 1px),#f0f2f5 12.5%)}.proc{position:absolute;top:8px;width:145px;height:53px;padding:7px;border:1px solid #dce3ed;border-left:3px solid #3b82f6;border-radius:7px;background:#fff;cursor:pointer}.conditional{border-left-color:#e7a329}.review{border-left-color:#df5d68}.proc b{font-size:8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.proc small{font-size:8px;color:#7f8b9e}.drawer{position:fixed;right:-400px;top:0;width:400px;height:100%;background:#fff;box-shadow:-8px 0 25px #18243a20;padding:24px;transition:.25s;z-index:5}.drawer.open{right:0}.close{float:right;border:0;padding:7px;border-radius:6px}.why,.law{padding:11px;border-radius:8px;font-size:10px;line-height:1.7;margin-top:8px}.why{background:#f4f8ff;border-left:3px solid #3b82f6}.law{background:#f7f9fc}@media(max-width:850px){.form{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div><div class="ey">RULE ENGINE MVP · LEGAL-SOURCE-SAFE</div><h1>지방투자 인허가 Process Dashboard</h1></div><button class="btn primary" onclick="analyze()">절차 다시 분석</button></div><section class="panel"><b style="font-size:12px">투자조건 입력</b><div class="form" style="margin-top:12px"><label>투자유형<select id="type"><option>신규 공장</option><option>기존공장 증설</option></select></label><label>업종<select id="industry"><option value="m">제조업</option><option value="n">비제조업</option></select></label><label>산업단지<select id="ic"><option value="1">예 · 일반산단</option><option value="0">아니오 · 개별입지</option></select></label><label>공장면적<input id="area" value="50000" type="number"></label><label>전력 MW<input id="power" value="80" type="number"></label><label>용수 ㎥/일<input id="water" value="8000" type="number"></label></div><div class="checks"><label><input id="building" type="checkbox" checked> 건축</label><label><input id="env" type="checkbox" checked> 환경</label><label><input id="waste" type="checkbox" checked> 폐수</label><label><input id="chem" type="checkbox" checked> 유해화학물질</label><label><input id="fire" type="checkbox" checked> 소방</label></div></section><section class="panel"><div style="font-size:16px;font-weight:bold">전북 군산시 반도체 제조공장 신설</div><div class="metrics"><div class="metric"><small>전체 절차</small><b id="total">0</b></div><div class="metric blue"><small>필수</small><b id="man">0</b></div><div class="metric amber"><small>조건부</small><b id="con">0</b></div><div class="metric red"><small>확인 필요</small><b id="rev">0</b></div><div class="metric purple"><small>Rule Engine 결과</small><b id="status">READY</b></div></div></section><section class="panel chips" id="chips"></section><div class="head2"><div><h2>인허가 Swimlane</h2><p>입력값 → Rule → Procedure → Swimlane</p></div></div><section class="swim"><div class="timeline"><span>투자검토</span><span>입지선정</span><span>인허가</span><span>착공</span><span>건축·설비</span><span>사용승인</span><span>공장등록</span><span>가동</span></div><div id="lanes"></div></section></div><aside id="drawer" class="drawer"><button class="close" onclick="drawer.classList.remove('open')">✕</button><div id="ds" style="margin-top:25px;font-size:10px;color:#2563eb"></div><h2 id="dt"></h2><div id="why" class="why"></div><h3>법적 근거</h3><div class="law">SOURCE_REQUIRED — 실제 조문·시행일·URL은 공식 법령 검증 후에만 표시합니다.</div></aside><script>const P=[['산업단지 입주계약','산단관리','산업단지','M',10,f=>f.ic],['공장설립 관련 승인','지자체','공장','M',20,f=>f.m],['건축허가/신고','건축','건축','M',10,f=>f.building],['환경 관련 검토','환경','환경','C',15,f=>f.env],['소방시설 관련 절차','소방','소방','C',7,f=>f.fire],['전력공급 협의','전력','전력','R',30,f=>f.power>=10],['용수공급 협의','용수','용수','C',20,f=>f.water>=1000],['폐수 관련 절차','환경','폐수','C',15,f=>f.waste],['화학물질 관련 절차 검토','환경','화학물질','C',15,f=>f.chem],['공장등록','기업','공장','M',3,f=>f.m]];const LS=['기업','산단관리','지자체','환경','건축','소방','전력','용수'];function facts(){return{m:industry.value==='m',ic:ic.value==='1',building:building.checked,env:env.checked,fire:fire.checked,waste:waste.checked,chem:chem.checked,power:+document.getElementById('power').value,water:+document.getElementById('water').value}}function analyze(){const f=facts(),r=P.filter(x=>x[5](f));total.textContent=r.length;man.textContent=r.filter(x=>x[3]=='M').length;con.textContent=r.filter(x=>x[3]=='C').length;rev.textContent=r.filter(x=>x[3]=='R').length;status.textContent='APPLIED';chips.innerHTML='<b style="font-size:9px">조건</b>'+[['투자유형',type.value],['업종',f.m?'제조업':'비제조업'],['입지',f.ic?'일반산단':'개별입지'],['면적',area.value+'㎡'],['전력',f.power+'MW'],['용수',f.water+'㎥/일']].map(a=>'<div class="chip"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');lanes.innerHTML='';LS.forEach(l=>{let q=r.filter(x=>x[1]==l);if(!q.length)return;let row=document.createElement('div');row.className='lane';row.innerHTML='<div class="name"><b>'+l+'</b><small>'+q.length+'개 절차</small></div><div class="track"></div>';q.forEach((p,i)=>{let c=document.createElement('div');c.className='proc '+(p[3]=='C'?'conditional':p[3]=='R'?'review':'');c.style.left=Math.min(80,8+i*18)+'%';c.innerHTML='<b>'+p[0]+'</b><small>'+p[4]+'일 · '+(p[3]=='M'?'필수':p[3]=='C'?'조건부':'확인 필요')+'</small>';c.onclick=()=>open(p,f);row.lastChild.appendChild(c)});lanes.appendChild(row)})}function open(p,f){dt.textContent=p[0];ds.textContent=p[3]=='M'?'필수':p[3]=='C'?'조건부':'확인 필요';why.innerHTML='① 업종 = '+(f.m?'제조업':'비제조업')+'<br>② 산업단지 = '+(f.ic?'예':'아니오')+'<br>③ 전력 = '+f.power+' MW<br>④ 용수 = '+f.water+' ㎥/일<br>⑤ Rule 조건 충족 → 절차 후보 선정';drawer.classList.add('open')}analyze();</script></body></html>
